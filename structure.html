<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Github Activity Analyzer</title>
</head>
<body>
    <header>
        <h1>Github Activity Analyzer</h1>
        <p>Analyze your Github development activity</p>
    </header>
    <div id="search-container">
        <input id="username" type="text" placeholder="Enter Github username">
        <button id="analyze-button">Analyze</button>

        <section id="result">
            <div id="profile">
                <h2 id="profile-name"></h2>
                <p id="profile-username"></p>
            </div>

            <div id="stats">
                <div class="stat-card">
                    <h3>Total Commits</h3>
                    <p id="total-commits">-</p>
                </div>

                <div class="stat-card">
                    <h3>Current Streak</h3>
                    <p id="current-streak">-</p>
                </div>

                <div class="stat-card">
                    <h3>Longest Streak</h3>
                    <p id="longest-streak">-</p>
                </div>

            </div>
        </section>
        <section id="commit-activity">
            <h2>Commit Activity</h2>

            <div id="commit-chart">
                <!--Commit chart will go here-->
            </div>
        </section>
    </div>
</body>
</html>
